<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Guide - Booking</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
<div class="logo">TravelGuide</div>
<ul class="nav-links">
<li><a href="index.html">Home</a></li>
<li><a href="#" id="loginLink">Login</a></li>
<li><a href="#">Register</a></li>
<li><a href="booking.html">Book Now</a></li>
<li><button id="themeToggle" class="theme-toggle" title="Toggle theme">🌓</button></li>
</ul>
</nav>

<!-- Login Modal -->
<div id="loginModal" class="modal">
<div class="modal-content">
<span class="close">&times;</span>
<h2>Login</h2>
<form id="loginForm">
<div class="form-group">
<label for="email">Email:</label>
<input type="email" id="email" name="email" placeholder="Enter your email" required>
</div>
<div class="form-group">
<label for="password">Password:</label>
<input type="password" id="password" name="password" placeholder="Enter your password" required>
</div>
<div id="loginError" class="error-message"></div>
<button type="submit" class="btn">Login</button>
</form>
</div>
</div>

<section class="booking-section">
<h2>Book Your Trip</h2>
<form class="booking-form">
<input type="text" placeholder="Destination Name" required>
<input type="date" required>
<input type="number" placeholder="Number of Guests" required>
<button type="submit" class="btn">Book Now</button>
</form>
</section>

<section class="destinations">
<h2>More Destinations</h2>
<div class="destination-grid">
<div class="card">
<img src="https://via.placeholder.com/250">
<h3>London</h3>
<p>Historic and cultural city.</p>
</div>
<div class="card">
<img src="https://via.placeholder.com/250">
<h3>Singapore</h3>
<p>Clean, green and modern.</p>
</div>
</div>
</section>

<footer>
<p>About | Contact | Help</p>
<p>© 2025 Travel Guide</p>
</footer>

<script src="script.js"></script>
</body>
</html>
