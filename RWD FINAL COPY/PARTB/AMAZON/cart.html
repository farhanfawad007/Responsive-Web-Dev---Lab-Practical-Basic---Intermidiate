<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Clone - Shopping Cart</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="cart.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <a href="index.html" class="logo-link">
                    <div class="logo">
                        <svg class="amazon-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="100" height="30">
                            <text x="10" y="35" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#000000">amazon</text>
                            <text x="95" y="35" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#000000">.in</text>
                            <path d="M 10 38 Q 100 20 190 38" stroke="#FF9900" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                        </svg>
                    </div>
                </a>
                <div class="delivery-location">
                    <i class="fas fa-map-marker-alt"></i>
                    <div class="location-text">
                        <span class="location-label">Delivering to</span>
                        <span class="location-value">Bengaluru 562130</span>
                    </div>
                </div>
            </div>
            <div class="nav-center">
                <div class="search-container">
                    <select class="search-category" id="searchCategory">
                        <option>All</option>
                        <option>Electronics</option>
                        <option>Clothing</option>
                        <option>Books</option>
                        <option>Home & Kitchen</option>
                    </select>
                    <input type="text" id="searchInput" class="search-input" placeholder="Search Amazon.in">
                    <button id="searchBtn" class="search-btn">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>
            <div class="nav-right">
                <div class="nav-item language-selector">
                    <i class="fas fa-flag"></i>
                    <span>EN</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="nav-item user-info" id="userInfo" style="cursor: pointer;">
                    <div class="user-info-top" id="userInfoTop">
                        <span class="user-greeting">Hello, sign in</span>
                    </div>
                    <div class="user-info-bottom">
                        <span>Account & Lists</span>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                </div>
                <div class="nav-item returns-orders">
                    <div class="returns-orders-top">Returns</div>
                    <div class="returns-orders-bottom">& Orders</div>
                </div>
                <a href="cart.html" class="nav-item cart-link">
                    <div class="cart-icon-wrapper">
                        <i class="fas fa-shopping-cart"></i>
                        <span id="cartCount" class="cart-count">0</span>
                    </div>
                    <span class="cart-text">Cart</span>
                </a>
                <button id="logoutBtn" class="logout-btn" style="display: none;">Logout</button>
                <button id="themeToggle" class="theme-toggle">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>
        <div class="nav-bottom">
            <div class="nav-bottom-content">
                <a href="index.html" class="nav-bottom-item">
                    <i class="fas fa-bars"></i>
                    <span>All</span>
                </a>
                <a href="index.html" class="nav-bottom-item">Today's Deals</a>
                <a href="index.html" class="nav-bottom-item">Customer Service</a>
                <a href="index.html" class="nav-bottom-item">Registry</a>
                <a href="index.html" class="nav-bottom-item">Gift Cards</a>
                <a href="index.html" class="nav-bottom-item">Sell</a>
            </div>
        </div>
    </nav>

    <!-- Cart Content -->
    <div class="container">
        <h1 class="cart-title">Shopping Cart</h1>
        
        <div id="cartContent">
            <!-- Cart items will be dynamically loaded here -->
        </div>

        <div class="cart-summary" id="cartSummary" style="display: none;">
            <div class="summary-card">
                <h3>Order Summary</h3>
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span id="subtotal">₹0.00</span>
                </div>
                <div class="summary-row">
                    <span>Tax:</span>
                    <span id="tax">₹0.00</span>
                </div>
                <div class="summary-row total">
                    <span>Total:</span>
                    <span id="total">₹0.00</span>
                </div>
                <button class="checkout-btn" id="checkoutBtn">Proceed to Checkout</button>
            </div>
        </div>

        <div id="emptyCart" class="empty-cart">
            <i class="fas fa-shopping-cart"></i>
            <h2>Your cart is empty</h2>
            <p>Add some products to get started!</p>
            <a href="index.html" class="shop-btn">Continue Shopping</a>
        </div>
    </div>

    <!-- Alert Messages -->
    <div id="alertContainer"></div>

    <script src="products.js"></script>
    <script src="utils.js"></script>
    <script src="auth.js"></script>
    <script src="cart.js"></script>
</body>
</html>
