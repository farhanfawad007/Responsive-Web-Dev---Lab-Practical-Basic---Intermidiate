<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube Clone — Watch</title>
    <link rel="stylesheet" href="./styles/base.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="./index.html" aria-label="Home">
          <img src="./assets/logo.svg" alt="YouTube" style="height:24px; width:auto;" />
        </a>

        <div class="search" role="search">
          <input id="searchInput" type="search" placeholder="Search" aria-label="Search videos" />
        </div>

        <div style="display:flex; align-items:center; gap:10px;">
          <button class="icon-btn" id="themeToggle" type="button" title="Toggle theme">
            Theme
          </button>
          <button class="icon-btn" id="logoutBtn" type="button" title="Logout">Logout</button>
        </div>
      </div>
    </header>

    <div class="container">
      <div class="layout" style="grid-template-columns: 1.6fr .9fr;">
        <main>
          <section class="panel" style="padding: 12px;">
            <div style="border-radius: 16px; overflow:hidden; border:1px solid var(--border); background:var(--panel-2);">
              <img id="viewer" alt="" style="width:100%; display:block; background:black;" />
            </div>

            <h1 id="title" style="margin: 12px 2px 6px 2px; font-size: 18px; line-height:1.25;"></h1>
            <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
              <div style="display:flex; align-items:center; gap:10px;">
                <div class="avatar" aria-hidden="true"></div>
                <div>
                  <div id="channel" style="font-weight:700;"></div>
                  <div id="stats" style="color:var(--muted); font-size:12px;"></div>
                </div>
              </div>
              <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                <button class="btn" id="likeBtn" type="button">Like</button>
                <button class="btn" id="saveBtn" type="button">Save</button>
                <button class="btn primary" id="subBtn" type="button">Subscribe</button>
              </div>
            </div>

            <div style="margin-top: 12px; display:flex; justify-content:space-between; align-items:center; gap:8px;">
              <div id="desc" style="flex:1; padding: 12px; border-radius: 14px; border:1px solid var(--border); background: var(--panel-2); color: var(--text); min-height:44px;"></div>
              <button class="btn" id="editDescBtn" type="button" style="flex:0 0 auto; white-space:nowrap;">Edit</button>
            </div>
          </section>
        </main>

        <aside>
          <section class="panel" style="padding: 12px;">
            <div style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
              <h2 style="margin:0; font-size: 14px;">Up next</h2>
              <a class="btn" href="./index.html" style="padding: 8px 10px;">Back</a>
            </div>
            <div id="upNext" style="margin-top: 12px; display:flex; flex-direction:column; gap:10px;"></div>
          </section>
        </aside>
      </div>
    </div>

    <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

    <script src="./scripts/storage.js"></script>
    <script src="./scripts/theme.js"></script>
    <script src="./scripts/auth.js"></script>
    <script src="./scripts/data.js"></script>
    <script src="./scripts/watch.js"></script>
  </body>
</html>
